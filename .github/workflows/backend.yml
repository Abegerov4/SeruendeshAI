name: backend
on:
  pull_request:
  push:
    branches: [main, big-data, "feature/**", "fix/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      LLM_API_KEY: ""
      LLM_ENABLED: "false"
      EMBED_MODEL: "off"
      WEATHER_ENABLED: "false"
      RAG_SEARCH_MODE: bm25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements-integration.txt
      - name: Full local integration, real canonical snapshot
        run: .venv/bin/python -m pytest data/tests rag/tests backend/tests ayat_backend/tests tests --pois data/processed/pois.json --live-backend --live-rag -q
      - name: Frozen retrieval evaluation
        run: .venv/bin/python -m rag.evaluate eval/datasets/astana_retrieval_v2.json --mode bm25 --output-dir /tmp/retrieval
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: docker compose config --quiet
      - run: docker build -f ayat_backend/Dockerfile --build-arg EMBED_MODEL=off -t seruendesh-primary .
      - run: docker run -d --name seruendesh-smoke -p 127.0.0.1:18001:8000 -e LLM_ENABLED=false -e WEATHER_ENABLED=false -e EMBED_MODEL=off seruendesh-primary
      - run: python scripts/smoke_runtime.py --base-url http://127.0.0.1:18001 --state /tmp/smoke.json
      - run: docker restart seruendesh-smoke
      - run: python scripts/smoke_runtime.py --base-url http://127.0.0.1:18001 --state /tmp/smoke.json --resume
      - if: always()
        run: docker rm -f seruendesh-smoke
