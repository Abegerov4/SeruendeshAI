name: backend

on:
  pull_request:
    paths: ["backend/**", "rag/**", ".github/workflows/backend.yml"]
  push:
    branches: [main, feature/backend]
    paths: ["backend/**", "rag/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Тесты детерминированные: без LLM-ключа, на mock-фикстуре (см. backend/tests/conftest.py)
      - run: pytest backend/tests -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t seruendesh-backend .
