name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: backend
        run: uv sync --group dev --no-group pipeline
      - name: Tests (template mode, no secrets needed)
        working-directory: backend
        env: {LLM_ENABLED: "false", EMBED_MODEL: "off", WEATHER_ENABLED: "false"}
        run: uv run pytest -q
      - name: Scenario eval (template mode)
        working-directory: backend
        env: {LLM_ENABLED: "false", EMBED_MODEL: "off"}
        run: uv run python ../eval/run_eval.py --no-llm --out /tmp/eval.md
