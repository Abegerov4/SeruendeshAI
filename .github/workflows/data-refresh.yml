name: data-refresh
# Weekly re-collection: the team catalogue (data/run_pipeline, Aslan) and the product snapshot the API serves
# (backend/pipeline: OSM, Overture, Wikidata, Wikipedia, CityPass layer, photos, events).
# Opens a PR with the new snapshot so changes can be reviewed before the demo uses them.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r backend/pyproject.toml -r requirements-integration.txt
      - name: Collect and build
        run: |
          .venv/bin/python -m data.run_pipeline --help
          .venv/bin/python -m data.run_pipeline --refresh
          .venv/bin/python -m pytest data/tests -q
          .venv/bin/python -m rag.evaluate eval/datasets/astana_retrieval_v2.json --mode bm25 --output-dir /tmp/refresh-eval
        env: {RAG_SEARCH_MODE: bm25}
      - name: Product snapshot used by the API (backend/pipeline)
        working-directory: backend
        run: |
          uv sync --all-groups
          uv run python -m pipeline.cli fetch
          uv run python -m pipeline.cli build
          uv run python -m pipeline.cli embed --model e5-large
          uv run python -m pipeline.cli events || true
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          title: "data: weekly POI snapshot refresh"
          commit-message: "data: weekly POI snapshot refresh"
          add-paths: data/processed
