name: data-refresh
# Automated re-collection of the POI dataset (OSM, Wikidata, Wikipedia, Overture, events) once a week.
# Opens a PR with the new snapshot so changes can be reviewed before the demo uses them.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: ayat_backend
        run: uv sync --all-groups
      - name: Collect and build
        working-directory: ayat_backend
        run: |
          uv run python -m pipeline.cli fetch
          uv run python -m pipeline.cli build
          uv run python -m pipeline.cli graph
          uv run python -m pipeline.cli embed --model e5-large
          uv run python -m pipeline.cli events || true
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          title: "data: weekly POI snapshot refresh"
          commit-message: "data: weekly POI snapshot refresh"
          add-paths: data/processed
