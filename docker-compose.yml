# Primary UI: docker compose up --build (http://127.0.0.1:8001).
# Original photo/MCP runtime: docker compose --profile secondary up --build.
services:
  web:
    build:
      context: .
      dockerfile: ayat_backend/Dockerfile
      args:
        EMBED_MODEL: off
    env_file:
      - path: .env
        required: false
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBED_MODEL: ${EMBED_MODEL:-off}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/state/accounts.db}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - accounts:/srv/state
    restart: unless-stopped

  backend:
    profiles: [secondary]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-bm25}
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.telegram_bot.bot"]
    env_file:
      - path: .env
        required: false
    environment:
      RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-bm25}
    restart: unless-stopped
    profiles: ["bot"]   # запускается явно: docker compose --profile bot up

volumes:
  accounts:
