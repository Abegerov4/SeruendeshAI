# Бэкенд Ayat (вариант с локальными эмбеддингами e5 и пешеходным графом). Запуск из ayat_backend/: docker compose up --build
services:
  api:
    build:
      context: ..
      dockerfile: ayat_backend/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBED_MODEL: ${EMBED_MODEL:-off}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/state/accounts.db}
    ports:
      - "8001:8000"
    mem_limit: 2g
    volumes:
      - accounts:/srv/state
    restart: unless-stopped
volumes:
  accounts:
