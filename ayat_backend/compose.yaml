# Бэкенд Ayat (вариант с локальными эмбеддингами e5 и пешеходным графом). Запуск из ayat_backend/: docker compose up --build
services:
  api:
    build:
      context: ..
      dockerfile: ayat_backend/Dockerfile
    env_file: ../.env
    ports:
      - "8001:8000"
    mem_limit: 2g
    restart: unless-stopped
