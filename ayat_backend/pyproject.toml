[project]
name = "seruendesh-backend"
version = "0.1.0"
description = "SeruendeshAI — RAG walking assistant for Astana (backend + data pipeline)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.146",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "openai>=3.35",
    "numpy>=2.5",
    "scipy>=1.16",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.0",
    "rapidfuzz>=3.14",
    "opening-hours-py>=2.1",
    "holidays>=0.106",
    "astral>=3.2",
    "httpx>=0.28",
    "fastembed>=0.9",
    "tzdata>=2025.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
]

[dependency-groups]
pipeline = [
    "typer>=0.27",
    "requests>=2.32",
    "osmnx>=2.0",
    "duckdb>=1.5",
    "shapely>=2.1",
]
dev = [
    "pytest>=9.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
