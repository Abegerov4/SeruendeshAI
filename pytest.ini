[pytest]
testpaths = .
norecursedirs = .git .venv venv node_modules dist .cache .pytest_cache __pycache__
pythonpath = .
addopts = -ra --strict-markers
markers =
    live_api: calls an explicitly enabled running backend
    live_backend: imports the actual backend guard implementation
    dataset: validates an explicitly supplied real POI dataset
    live_rag: imports and exercises the actual RAG implementation
    live_ui: opens the actual frontend in an optional Playwright browser
